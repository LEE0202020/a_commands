<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Content Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff;color:#111;font-family:'Noto Sans KR',sans-serif;overflow-x:hidden}
  .hero{text-align:center;padding:72px 16px 150px}
  .hero h1{font-family:'Gowun Batang',serif;font-weight:400;font-size:clamp(30px,4.4vw,70px);line-height:1.3;letter-spacing:-.02em}
  .btn{display:inline-flex;gap:10px;align-items:center;margin-top:52px;background:#ffe100;color:#111;text-decoration:none;
       padding:18px 30px;border-radius:999px;font-weight:500;font-size:18px;transition:transform .2s}
  .btn:hover{transform:translateY(-3px)}
  .strip{overflow:hidden}
  .track{display:flex;width:max-content;animation:scroll 40s linear infinite}
  .strip:hover .track{animation-play-state:paused}
  @keyframes scroll{to{transform:translateX(-50%)}}
  .card{height:clamp(260px,28vw,410px);flex:none;position:relative;overflow:hidden;color:#fff;
        display:flex;flex-direction:column;justify-content:space-between;padding:18px}
  .card .t{font-weight:700;font-size:clamp(28px,3vw,48px);line-height:1}
  .card small{font-size:12px;opacity:.85}
  .c1{width:19vw;min-width:200px;background:linear-gradient(#f4f4f4 32%,#7a3b2e 32% 60%,#c9c4b8 60%);color:#111}
  .c2{width:20vw;min-width:210px;background:#fff;color:#111}
  .c2::after{content:"";position:absolute;inset:30% 15% 15%;background:conic-gradient(#ff2fa0,#2cf,#3f3,#ff0,#f40,#ff2fa0);border-radius:40% 10% 50% 20%;filter:saturate(1.4)}
  .c3{width:21vw;min-width:220px;background:linear-gradient(#e9e6df 55%,#3d7a4c 55% 75%,#ddd 75%);align-items:center;justify-content:center}
  .c3 .t{font-style:italic;text-shadow:0 2px 8px #0004}
  .c4{width:21vw;min-width:220px;background:radial-gradient(circle at 50% 55%,#e9e2ff 0 14%,#4ac 15% 22%,#6b4a2e 23%)}
  .c5{width:25vw;min-width:250px;background:repeating-linear-gradient(100deg,#fff 0 14px,#2a8fe0 14px 22px)}
  .c5 .t{font-size:clamp(60px,8vw,130px);color:#e43;-webkit-text-stroke:3px #2a3;align-self:center;margin:auto}
  .c6{width:22vw;min-width:220px;background:linear-gradient(#fafafa 60%,#222 60%);color:#b01a2a}
  .c6 .t{font-family:'Gowun Batang',serif;letter-spacing:.04em}
  .c7{width:20vw;min-width:200px;background:linear-gradient(#6aa2d8,#eef 55%,#3a4a3a 56%)}
  .edit{position:fixed;right:24px;bottom:24px;width:50px;height:50px;border-radius:50%;background:#1f2a24;color:#9f9;
        display:grid;place-items:center;font-size:20px;box-shadow:0 4px 12px #0003}
</style>
</head>
<body>
  <section class="hero">
    <h1>디자인 관점으로 콘텐츠를<br>기획하고 비즈니스와 연결합니다</h1>
    <a class="btn" href="#work">프로젝트 보기 <span>→</span></a>
  </section>

  <section class="strip" id="work">
    <div class="track" id="track">
      <div class="card c1"><div><small>Vol.01 · 2026</small><div class="t">Design</div></div><small>Special Feature</small></div>
      <div class="card c2"><div class="t" style="font-size:24px">SEOUL<br>DESIGN<br>FESTIVAL</div><small>2026.11.26 — 29</small></div>
      <div class="card c3"><div class="t">hey<br>POP</div></div>
      <div class="card c4"><div class="t" style="font-size:26px">행복이<br>가득한 집</div><small>Global Living Now</small></div>
      <div class="card c5"><div class="t">BDF</div></div>
      <div class="card c6"><div class="t">LUXURY</div><small style="color:#fff">July 2026</small></div>
      <div class="card c7"><div class="t" style="font-size:22px">행복이<br>가득한집</div></div>
    </div>
  </section>

  <div class="edit">✎</div>
<script>
  const t=document.getElementById('track'); t.innerHTML+=t.innerHTML; // seamless loop
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifestyle Menu List</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;padding:24px 16px}
  .menu{display:flex;gap:14px;list-style:none;overflow-x:auto;padding:12px 4px}
  .menu a{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:#222;font-size:14px;width:52px}
  .ic{position:relative;width:48px;height:48px;border-radius:16px;border:1px solid #e9ecef;background:#fff;
      display:grid;place-items:center;box-shadow:0 1px 3px #0000000d;transition:transform .15s}
  .menu a:hover .ic{transform:translateY(-3px)}
  .ic svg{width:28px;height:28px}
</style>
</head>
<body>
<ul class="menu">
  <!-- 청소: 빗자루 -->
  <li><a href="#"><span class="ic"><svg viewBox="0 0 24 24"><path d="M15 2l-4 9" stroke="#8b5a2b" stroke-width="2" stroke-linecap="round"/><path d="M8 10h7l3 11H5z" fill="#1ec85b"/><path d="M8 15v5M11.5 15v5M15 15v5" stroke="#fff" stroke-width="1.3"/></svg></span>청소</a></li>
  <!-- 가구: 소파 -->
  <li><a href="#"><span class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="7" rx="2" fill="#6b4ff6"/><rect x="2" y="10" width="20" height="7" rx="2" fill="#6b4ff6"/><rect x="6" y="12" width="12" height="3" rx="1" fill="#fff"/><path d="M4 17v3M20 17v3" stroke="#6b4ff6" stroke-width="2"/></svg></span>가구</a></li>
  <!-- 음식: 그릇 -->
  <li><a href="#"><span class="ic"><svg viewBox="0 0 24 24"><path d="M9 3c-1 2 1 3 0 5M13 3c-1 2 1 3 0 5" stroke="#f59e0b" stroke-width="1.6" fill="none"/><path d="M3 11h18a9 9 0 0 1-18 0z" fill="#f97316"/><path d="M7 21h10" stroke="#f97316" stroke-width="2"/></svg></span>음식</a></li>
  <!-- 운동: 덤벨 -->
  <li><a href="#"><span class="ic"><svg viewBox="0 0 24 24"><rect x="2" y="8" width="4" height="8" rx="1" fill="#4f7cf5"/><rect x="18" y="8" width="4" height="8" rx="1" fill="#4f7cf5"/><rect x="5" y="6" width="3" height="12" rx="1" fill="#2f6bf0"/><rect x="16" y="6" width="3" height="12" rx="1" fill="#2f6bf0"/><rect x="8" y="11" width="8" height="2" fill="#111"/></svg></span>운동</a></li>
</ul>
</body>
</html>
